<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Post Generator - Create Engaging Professional Content</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="top-nav">
        <div class="auth-bar" id="authBar">
            <span id="userBadge" style="display: none;" class="user-badge"><i class="fas fa-user-circle"></i> <span id="userEmailText"></span></span>
            <button id="authBtn" onclick="openAuthModal()" class="btn-auth"><i class="fas fa-sign-in-alt"></i> Login / Register</button>
            <button id="logoutBtn" onclick="logoutUser()" style="display: none;" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
        <button id="darkModeToggle" class="theme-toggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>
    
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fab fa-linkedin"></i>
                <h1>LinkedIn Post Generator</h1>
            </div>
            <p class="tagline">Create engaging professional content that resonates with your network</p>
        </header>

        <div class="main-content">
            <!-- Post Generator Card -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-pen-fancy"></i>
                    <h2>Generate Post</h2>
                </div>
                <div class="card-body">
                    <form id="postForm">
                        <div class="form-group">
                            <label for="topic"><i class="fas fa-tag"></i> Topic *</label>
                            <input type="text" id="topic" name="topic" required 
                                   placeholder="e.g., Artificial Intelligence in Marketing">
                            <div class="char-counter">
                                <span id="charCount">0</span> / 100 characters
                                <div class="progress-bar">
                                    <div id="charProgress" class="progress-fill"></div>
                                </div>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="postType"><i class="fas fa-layer-group"></i> Post Type</label>
                                <select id="postType">
                                    <option value="professional">💼 Professional Insight</option>
                                    <option value="networking">🤝 Networking</option>
                                    <option value="achievement">🏆 Achievement/Celebration</option>
                                    <option value="tech">💻 Technology & Innovation</option>
                                    <option value="marketing">📢 Marketing & Growth</option>
                                    <option value="leadership">👥 Leadership & Management</option>
                                    <option value="career">🚀 Career Advice</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="postLength"><i class="fas fa-ruler"></i> Length</label>
                                <select id="postLength">
                                    <option value="short">Short (100-150 words)</option>
                                    <option value="medium" selected>Medium (200-300 words)</option>
                                    <option value="long">Long (400-500 words)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="keyPoints"><i class="fas fa-list"></i> Key Points (comma-separated)</label>
                            <input type="text" id="keyPoints" 
                                   placeholder="e.g., Data-driven decisions, Team collaboration, ROI improvement">
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-magic"></i> Generate Post
                        </button>
                        
                        <button type="button" onclick="saveCurrentTemplate()" class="btn-save-template">
                            <i class="fas fa-star"></i> Save as Favorite
                        </button>
                    </form>
                </div>
            </div>

            <!-- Message Generator Card -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-envelope"></i>
                    <h2>Professional Message</h2>
                </div>
                <div class="card-body">
                    <form id="messageForm">
                        <div class="form-group">
                            <label for="recipientName"><i class="fas fa-user"></i> Recipient Name *</label>
                            <input type="text" id="recipientName" required placeholder="e.g., John Smith">
                        </div>

                        <div class="form-group">
                            <label for="messageContext"><i class="fas fa-comment-alt"></i> Context / Connection *</label>
                            <input type="text" id="messageContext" required placeholder="e.g., Met at Tech Conference 2024">
                        </div>

                        <div class="form-group">
                            <label for="messagePurpose"><i class="fas fa-bullseye"></i> Purpose</label>
                            <select id="messagePurpose">
                                <option value="networking">🤝 General Networking</option>
                                <option value="collaboration">💼 Partnership / Collaboration</option>
                                <option value="job_inquiry">🎯 Job Opportunity Inquiry</option>
                                <option value="advice">💡 Seeking Advice</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-secondary">
                            <i class="fas fa-paper-plane"></i> Generate Message
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div id="resultsContainer" class="results-container">
            <div id="postResult" class="result-card" style="display: none;">
                <div class="result-header">
                    <i class="fas fa-file-alt"></i>
                    <h3>Generated Post</h3>
                    <div class="button-group">
                        <button onclick="exportAsPDF()" class="export-btn"><i class="fas fa-file-pdf"></i> PDF</button>
                        <button onclick="exportAsImage()" class="export-btn"><i class="fas fa-image"></i> Image</button>
                        <button onclick="shareToLinkedIn()" class="share-btn"><i class="fab fa-linkedin"></i> Share</button>
                        <button onclick="copyToClipboard('postContent')" class="copy-btn"><i class="fas fa-copy"></i> Copy</button>
                    </div>
                </div>
                <div id="postContent" class="result-content"></div>
                <div id="postHashtags" class="hashtags"></div>
            </div>

            <div id="messageResult" class="result-card" style="display: none;">
                <div class="result-header">
                    <i class="fas fa-comment-dots"></i>
                    <h3>Generated Message</h3>
                    <button onclick="copyToClipboard('messageContent')" class="copy-btn"><i class="fas fa-copy"></i> Copy</button>
                </div>
                <div id="messageContent" class="result-content"></div>
            </div>
        </div>

        <div class="analyzer-card">
            <div class="card-header">
                <i class="fas fa-chart-line"></i>
                <h2>Analyze Your Post</h2>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label for="textToAnalyze"><i class="fas fa-file-text"></i> Paste your LinkedIn post here</label>
                    <textarea id="textToAnalyze" rows="6" placeholder="Paste your LinkedIn post here..."></textarea>
                </div>
                <button onclick="analyzeText()" class="btn btn-analyzer"><i class="fas fa-search"></i> Analyze Post</button>
                <div id="analysisResult" class="analysis-result"></div>
            </div>
        </div>

        <div id="loadingOverlay" class="loading-overlay" style="display: none;">
            <div class="spinner"></div>
            <p>Generating your content...</p>
        </div>
    </div>

    <!-- Auth Modal Dialog -->
    <div id="authModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <button class="modal-close" onclick="closeAuthModal()">&times;</button>
            <div class="modal-tabs">
                <button id="tabLoginBtn" class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
                <button id="tabRegisterBtn" class="tab-btn" onclick="switchAuthTab('register')">Register</button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="loginEmail" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Login</button>
            </form>

            <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="registerEmail" required placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password (min 6 chars)</label>
                    <input type="password" id="registerPassword" minlength="6" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Register</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
