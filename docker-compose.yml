version: '3.8'

services:
  api:
    build: .
    container_name: linkedin_post_generator_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/linkedin_db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-super-secret-jwt-key}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: linkedin_post_generator_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: linkedin_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
